services:
  - type: web
    name: fdm-fault-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: INFERENCE_ENGINE
        value: torch
      # Set this to the deployed Vercel frontend URL once it exists.
      - key: ALLOWED_ORIGINS
        value: "*"
