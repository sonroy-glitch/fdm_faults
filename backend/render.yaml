services:
  - type: web
    name: fdm-fault-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker, two threads: the free tier has 512 MB and torch alone accounts
    # for most of the ~270 MB working set, so extra workers would each reload it.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: INFERENCE_ENGINE
        value: torch
      # Keep BLAS from spawning a thread per core; saves memory and avoids
      # oversubscribing the shared free-tier CPU.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # Replace with the deployed frontend origin once it exists.
      - key: ALLOWED_ORIGINS
        value: "*"
