services:
  - type: web
    name: fdm-fault-api
    runtime: python
    plan: free
    rootDir: backend
    # ONNX Runtime rather than PyTorch: same outputs (verified to ~1e-6), far
    # smaller install and a much faster cold start on the free tier.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: INFERENCE_ENGINE
        value: onnx
      # Lock this down to the deployed Vercel frontend origin once it exists.
      - key: ALLOWED_ORIGINS
        value: "*"
